spring.application.name=TileWebsite

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tile_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

logging.file.name=logs/tile-pro-access.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30

cloudflare.turnstile.site-key=${TURNSTILE_SITE_KEY:1x00000000000000000000AA}
cloudflare.turnstile.secret-key=${TURNSTILE_SECRET_KEY:1x000000000000000000000000000000AA}

app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin}